name: Build and Deploy to itch.io

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # ── Konfigurasi non-sensitif (bisa juga dipindah ke Settings > Secrets and variables > Actions > Variables) ──
  UNITY_PROJECT_PATH: ${{ vars.UNITY_PROJECT_PATH || '.' }}
  ITCH_USER: ${{ vars.ITCH_USER }}
  ITCH_GAME: ${{ vars.ITCH_GAME }}
  GAME_DISPLAY_NAME: ${{ vars.GAME_DISPLAY_NAME || vars.ITCH_GAME }}
  ITCH_CHANNEL_WINDOWS: ${{ vars.ITCH_CHANNEL_WINDOWS || 'windows' }}
  ITCH_CHANNEL_LINUX: ${{ vars.ITCH_CHANNEL_LINUX || 'linux' }}
  ITCH_CHANNEL_MAC: ${{ vars.ITCH_CHANNEL_MAC || 'mac' }}
  ITCH_CHANNEL_WEBGL: ${{ vars.ITCH_CHANNEL_WEBGL || 'html5' }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
  GEMINI_PERSONA: ${{ vars.GEMINI_PERSONA || 'You are a laid-back, enthusiastic game release announcer with a light sense of humor.' }}
  # Kosongkan GEMINI_LANGUAGE kalau mau bahasa mengikuti bahasa dari GEMINI_PERSONA sendiri
  GEMINI_LANGUAGE: ${{ vars.GEMINI_LANGUAGE || '' }}

jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
          - WebGL
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles(format('{0}/Assets/**', env.UNITY_PROJECT_PATH), format('{0}/Packages/**', env.UNITY_PROJECT_PATH), format('{0}/ProjectSettings/**', env.UNITY_PROJECT_PATH)) }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: ${{ matrix.targetPlatform }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 3

  deploy:
    name: Deploy to itch.io
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository (untuk versi/tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version string
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Install Butler (itch.io CLI)
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d butler
          chmod +x butler/butler
          echo "$(pwd)/butler" >> $GITHUB_PATH

      - name: Verify Butler
        run: butler -V

      - name: Push Windows build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push builds/Build-StandaloneWindows64 "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:${{ env.ITCH_CHANNEL_WINDOWS }}" --userversion "${{ steps.version.outputs.value }}"

      - name: Push Linux build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push builds/Build-StandaloneLinux64 "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:${{ env.ITCH_CHANNEL_LINUX }}" --userversion "${{ steps.version.outputs.value }}"

      - name: Push macOS build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push builds/Build-StandaloneOSX "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:${{ env.ITCH_CHANNEL_MAC }}" --userversion "${{ steps.version.outputs.value }}"

      - name: Push WebGL build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push builds/Build-WebGL "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:${{ env.ITCH_CHANNEL_WEBGL }}" --userversion "${{ steps.version.outputs.value }}"

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Hanya jalan kalau workflow dipicu oleh tag versi (contoh: v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Zip each platform build
        run: |
          cd builds
          for dir in */ ; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done

      - name: Create GitHub Release with build assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  notify:
    name: Notify Discord
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Generate flavor text with Gemini
        id: flavor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          LANGUAGE_INSTRUCTION=""
          if [ -n "${GEMINI_LANGUAGE}" ]; then
            LANGUAGE_INSTRUCTION="Write the response in ${GEMINI_LANGUAGE}."
          else
            LANGUAGE_INSTRUCTION="Write the response in the same language used in the persona instructions above."
          fi

          PROMPT="${GEMINI_PERSONA}

          Write ONE short paragraph (max 3 sentences, no markdown formatting, no surrounding quotation marks) announcing that a new build of the game \"${GAME_DISPLAY_NAME}\" version ${VERSION} has been successfully deployed to Windows, Linux, macOS, and Web on itch.io. Match the tone and style of the persona above. ${LANGUAGE_INSTRUCTION}"

          BODY=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$TEXT" ]; then
            echo "Gemini gagal merespons, fallback ke pesan default. Response mentah:"
            echo "$RESPONSE"
            TEXT="Build baru ${GAME_DISPLAY_NAME} versi ${VERSION} sudah tayang di itch.io!"
          fi

          {
            echo "text<<GEMINI_EOF"
            echo "$TEXT"
            echo "GEMINI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.deploy.outputs.version }}
          FLAVOR_TEXT: ${{ steps.flavor.outputs.text }}
        run: |
          ITCH_URL="https://${ITCH_USER}.itch.io/${ITCH_GAME}"

          PAYLOAD=$(jq -n \
            --arg content "$FLAVOR_TEXT" \
            --arg title "${GAME_DISPLAY_NAME} — Build ${VERSION} deployed" \
            --arg url "$ITCH_URL" \
            '{
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: $content,
                  color: 5814783,
                  fields: [
                    { name: "Windows", value: "✅", inline: true },
                    { name: "Linux", value: "✅", inline: true },
                    { name: "macOS", value: "✅", inline: true },
                    { name: "Web", value: "✅", inline: true }
                  ]
                }
              ]
            }')

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
